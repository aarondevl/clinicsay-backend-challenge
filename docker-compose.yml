# `api` (puerto 3000, CLOCK_MODE=test) con su Postgres. El servicio `provider`
# es el de la prueba y no se modifica.
services:
  provider:
    build: ./provider
    ports:
      - "4010:4010"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clinicsay
      POSTGRES_PASSWORD: clinicsay
      POSTGRES_DB: clinicsay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicsay -d clinicsay"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      CLOCK_MODE: test
      PROVIDER_URL: http://provider:4010
      DATABASE_URL: postgres://clinicsay:clinicsay@db:5432/clinicsay
    depends_on:
      db:
        condition: service_healthy
      provider:
        condition: service_started
